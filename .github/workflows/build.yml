name: Build Ember Client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "fabric/mods.txt"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Patcher kit (o_xer's Eaglercraft 26.2 u2 setup), pinned by hash.
  SETUP_JAR_URL: https://github.com/melonman106/Eagler-26.2-Client/releases/download/Cleit/Eaglercraft-26.2-u2-Setup.jar
  SETUP_JAR_SHA256: d8e7240fba804249eae5706a6641b3fbd783a4c09923d31d4ee4c6386a273587
  # Official Minecraft 26.2 client jar from Mojang, pinned by SHA-1.
  CLIENT_JAR_URL: https://piston-data.mojang.com/v1/objects/2dc72797acbc1b63fc16a11c4ac393605f453754/client.jar
  CLIENT_JAR_SHA1: 2dc72797acbc1b63fc16a11c4ac393605f453754

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch and verify inputs
        run: mkdir -p "$RUNNER_TEMP/logs" && bash scripts/fetch-inputs.sh 2>&1 | tee "$RUNNER_TEMP/logs/fetch-inputs.log"

      - name: Create source project
        run: mkdir -p "$RUNNER_TEMP/logs" && bash scripts/create-project.sh 2>&1 | tee "$RUNNER_TEMP/logs/create-project.log"

      - name: Apply Ember overlay
        run: mkdir -p "$RUNNER_TEMP/logs" && bash scripts/apply-overlay.sh 2>&1 | tee "$RUNNER_TEMP/logs/apply-overlay.log"

      - name: Fabric layer (bake mods into the game)
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          { bash scripts/fetch-fabric.sh "$RUNNER_TEMP/fabric" && bash scripts/fabric-bake.sh "$RUNNER_TEMP/ws" "$RUNNER_TEMP/fabric"; } 2>&1 | tee "$RUNNER_TEMP/logs/fabric.log"

      # The singleplayer server and the chunk-mesh worker don't contain mods, so a
      # copy from an earlier build is reused instead of recompiling them (~15 min).
      - name: Restore cached server and mesh workers
        id: workers
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/ws/target_teavm_wasm_gc_server/build/generated/teavm/wasm-gc
            ${{ runner.temp }}/ws/target_teavm_wasm_gc_mesh/build/generated/teavm/wasm-gc
          key: workers-v1-${{ hashFiles('scripts/fetch-inputs.sh', 'scripts/create-project.sh', 'fabric/tools/**', 'scripts/fabric-bake.sh') }}

      - name: Build standalone HTML
        env:
          EMBER_REUSE_WORKERS: ${{ steps.workers.outputs.cache-hit }}
          EAGLER_LINK_CAP_MIB: "13312"
          EAGLER_LINK_HEAP_MIB: "11264"
          EAGLER_SERVER_LINK_CAP_MIB: "13312"
          EAGLER_SERVER_LINK_HEAP_MIB: "11264"
          EAGLER_BUILD_CAP_MIB: "13312"
          EMBER_ALLOW_MISSING: "1"
        run: mkdir -p "$RUNNER_TEMP/logs" && bash scripts/build-html.sh 2>&1 | tee "$RUNNER_TEMP/logs/build-html.log"

      - name: Save server and mesh workers for later builds
        if: success() && steps.workers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/ws/target_teavm_wasm_gc_server/build/generated/teavm/wasm-gc
            ${{ runner.temp }}/ws/target_teavm_wasm_gc_mesh/build/generated/teavm/wasm-gc
          key: workers-v1-${{ hashFiles('scripts/fetch-inputs.sh', 'scripts/create-project.sh', 'fabric/tools/**', 'scripts/fabric-bake.sh') }}

      - name: Push logs to the ci-logs branch
        if: always()
        run: |
          set -uo pipefail
          L="$RUNNER_TEMP/ci-logs"; rm -rf "$L"; mkdir -p "$L"
          for f in "$RUNNER_TEMP"/logs/*.log; do [ -f "$f" ] && tail -c 400000 "$f" > "$L/$(basename "$f")"; done
          for f in "$RUNNER_TEMP"/fabric/baked/bake-report.txt "$RUNNER_TEMP"/fabric/disabled-mixins.txt "$RUNNER_TEMP"/fabric/mods.json; do [ -f "$f" ] && cp "$f" "$L/"; done
          find "$RUNNER_TEMP/ws" -name '*.log' -newer "$RUNNER_TEMP/inputs/setup.jar" -size -20M 2>/dev/null | while read -r f; do tail -c 400000 "$f" > "$L/ws-$(echo "${f#$RUNNER_TEMP/ws/}" | tr '/' '_')"; done
          ls -la "$GITHUB_WORKSPACE"/out/ > "$L/output-files.txt" 2>&1 || true
          echo "run ${{ github.run_id }} at $(date -u)" > "$L/RUN.txt"
          cd "$L"
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Logs for run ${{ github.run_id }}"
          B="ci-logs"; [ "${{ github.ref_name }}" != "main" ] && B="ci-logs-${{ github.ref_name }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$B"

      - name: Publish result and logs as a draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p logs
          find ws -name '*.log' -newer inputs/setup.jar -size -20M -exec cp --parents {} logs/ \; 2>/dev/null || true
          cp fabric/bake.log fabric/baked/bake-report.txt fabric/disabled-mixins.txt logs/ 2>/dev/null || true
          (cd logs && zip -q -r ../logs.zip .) || true
          TAG="build-latest"; [ "${{ github.ref_name }}" != "main" ] && TAG="build-${{ github.ref_name }}"
          bash "$GITHUB_WORKSPACE/scripts/publish-draft.sh" "$TAG" "Build $TAG" \
            "$RUNNER_TEMP/logs.zip" "$RUNNER_TEMP/fabric/mods.json" "$GITHUB_WORKSPACE"/out/*.html
