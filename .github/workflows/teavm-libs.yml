name: TeaVM libs (debug)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download TeaVM helper libraries
        run: |
          mkdir out && cd out
          for a in teavm-relocated-libs-asm teavm-relocated-libs-asm-tree teavm-relocated-libs-asm-commons teavm-relocated-libs-asm-util teavm-relocated-libs-asm-analysis teavm-relocated-libs-hppc teavm-relocated-libs-commons-io; do
            curl -sfLO "https://repo1.maven.org/maven2/org/teavm/$a/0.13.1/$a-0.13.1.jar" && echo "ok $a" || echo "missing $a"
          done
          ls -la
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash scripts/publish-draft.sh teavm-libs "TeaVM libs" out/*.jar
