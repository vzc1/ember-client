<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client</title>
<script src="site-config.js"></script>
<style>
  :root {
    --bg: #0e0d10;
    --panel: #17151b;
    --panel-2: #1f1c24;
    --line: #2c2833;
    --text: #ece8f1;
    --muted: #9a93a6;
    --accent: #ff7a3d;
    --accent-2: #ffb347;
    --ok: #4ade80;
    --next: #60a5fa;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  nav { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px);
    background: rgba(14,13,16,.8); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; align-items: center; gap: 14px; height: 60px; }
  .logo { width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 24px rgba(255,122,61,.45); }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: .2px; }
  .badge { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line);
    border-radius: 999px; color: var(--muted); }
  nav .spacer { flex: 1; }
  nav a.link { text-decoration: none; color: var(--muted); font-weight: 600; }
  nav a.link:hover { color: var(--text); }

  .btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    border: 0; border-radius: 10px; padding: 11px 20px; font-weight: 700;
    font-size: 15px; text-decoration: none; transition: transform .08s, filter .15s; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #1a0d05; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  .btn-ghost:hover { border-color: #3d3746; }

  header.hero { padding: 80px 0 56px; position: relative; overflow: hidden; }
  header.hero::before { content: ""; position: absolute; inset: -40% -10% auto auto;
    width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,122,61,.22), transparent 65%); pointer-events: none; }
  .hero h1 { font-size: clamp(36px, 6vw, 64px); line-height: 1.05; margin: 0 0 14px; letter-spacing: -1px; }
  .hero h1 span { background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--muted); font-size: 18px; max-width: 560px; margin: 0 0 28px; }
  .hero .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .hero .note { margin-top: 16px; font-size: 13px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 0 56px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .stat b { display: block; font-size: 24px; }
  .stat small { color: var(--muted); }

  section h2 { font-size: 26px; margin: 0 0 6px; }
  section .sub { color: var(--muted); margin: 0 0 20px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .search { flex: 1 1 240px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; color: var(--text); font: inherit; outline: none; }
  .search:focus { border-color: var(--accent); }
  .chip { background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .chip[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: rgba(255,122,61,.12); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .card:hover { border-color: #3d3746; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card h3 { margin: 0; font-size: 16px; }
  .card .by { color: var(--muted); font-size: 13px; }
  .card p { margin: 0; color: #c9c3d3; font-size: 14px; }
  .status { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
    padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .status.included { color: var(--ok); background: rgba(74,222,128,.12); }
  .status.next { color: var(--next); background: rgba(96,165,250,.12); }
  .status.planned { color: var(--muted); background: var(--panel-2); }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; grid-column: 1 / -1; }

  footer { border-top: 1px solid var(--line); margin-top: 72px; padding: 28px 0 40px; color: var(--muted); font-size: 13px; }
  footer ul { margin: 0 0 10px; padding-left: 18px; }

  @media (max-width: 640px) {
    nav a.link { display: none; }
    header.hero { padding: 48px 0 36px; }
    .stats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <div class="logo" aria-hidden="true"></div>
    <div class="brand" id="brand">Client</div>
    <span class="badge" id="ver">26.2</span>
    <div class="spacer"></div>
    <a class="link" href="#mods">Mods</a>
    <a class="btn btn-primary" id="navPlay" href="play.html">Play</a>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <h1>Play <span id="heroName">Client</span></h1>
    <p id="tagline"></p>
    <div class="actions">
      <a class="btn btn-primary" id="play" href="play.html">▶ Play now</a>
      <a class="btn btn-ghost" id="download" href="play.html" download>Download offline</a>
    </div>
    <div class="note">Works best in Chrome or Edge. Saves stay in your browser.</div>
  </div>
</header>

<main class="wrap">
  <div class="stats">
    <div class="stat"><b id="statVer">26.2</b><small>Minecraft version</small></div>
    <div class="stat"><b id="statIncluded">0</b><small>Mods included</small></div>
    <div class="stat"><b id="statPlanned">0</b><small>Mods on the way</small></div>
  </div>

  <section id="mods">
    <h2>Mods</h2>
    <p class="sub">What's in the client now and what's coming next.</p>
    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="Search mods" aria-label="Search mods">
      <div id="chips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <ul id="credits"></ul>
    Not affiliated with Mojang or Microsoft.
  </div>
</footer>

<script>
(function () {
  var S = window.SITE || { name: "Client", tagline: "", version: "", gameFile: "play.html", credits: [], mods: [] };
  var $ = function (id) { return document.getElementById(id); };

  document.title = S.name + " " + S.version;
  $("brand").textContent = S.name;
  $("heroName").textContent = S.name;
  $("tagline").textContent = S.tagline;
  $("ver").textContent = S.version;
  $("statVer").textContent = S.version;
  ["play", "navPlay", "download"].forEach(function (id) { $(id).href = S.gameFile; });
  $("download").setAttribute("download", S.name.replace(/\s+/g, "-") + "-" + S.version + ".html");

  var included = S.mods.filter(function (m) { return m.status === "included"; }).length;
  $("statIncluded").textContent = included;
  $("statPlanned").textContent = S.mods.length - included;

  S.credits.forEach(function (c) {
    var li = document.createElement("li"); li.textContent = c; $("credits").appendChild(li);
  });

  var labels = { included: "Included", next: "In progress", planned: "Planned" };
  var cats = ["All"].concat(Array.from(new Set(S.mods.map(function (m) { return m.category; }))));
  var active = "All";

  cats.forEach(function (c) {
    var b = document.createElement("button");
    b.className = "chip"; b.textContent = c; b.setAttribute("aria-pressed", c === active);
    b.onclick = function () {
      active = c;
      Array.prototype.forEach.call($("chips").children, function (x) { x.setAttribute("aria-pressed", x.textContent === c); });
      render();
    };
    $("chips").appendChild(b);
  });
  $("q").addEventListener("input", render);

  function render() {
    var q = $("q").value.trim().toLowerCase();
    var order = { included: 0, next: 1, planned: 2 };
    var list = S.mods.filter(function (m) {
      return (active === "All" || m.category === active) &&
        (!q || (m.name + " " + m.author + " " + m.description).toLowerCase().indexOf(q) !== -1);
    }).sort(function (a, b) { return order[a.status] - order[b.status] || a.name.localeCompare(b.name); });

    var grid = $("grid"); grid.innerHTML = "";
    if (!list.length) { grid.innerHTML = '<div class="empty">No mods match that.</div>'; return; }
    list.forEach(function (m) {
      var card = document.createElement("div"); card.className = "card";
      var top = document.createElement("div"); top.className = "card-top";
      var h = document.createElement("div");
      var h3 = document.createElement("h3"); h3.textContent = m.name;
      var by = document.createElement("div"); by.className = "by"; by.textContent = "by " + m.author + " · " + m.category;
      h.appendChild(h3); h.appendChild(by);
      var st = document.createElement("span"); st.className = "status " + m.status; st.textContent = labels[m.status] || m.status;
      top.appendChild(h); top.appendChild(st);
      var p = document.createElement("p"); p.textContent = m.description;
      card.appendChild(top); card.appendChild(p);
      grid.appendChild(card);
    });
  }
  render();
})();
</script>
</body>
</html>
